<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CRO Report Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: #f5f4f0;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      font-weight: normal;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      color: #111;
    }

    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 36px;
      font-family: monospace;
    }

    .wrapper {
      max-width: 740px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── CONTAINERS ── */
    .card {
      background: #fff;
      border: 1px solid #e0ddd8;
      border-radius: 10px;
      padding: 28px 32px;
    }

    .card-title {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 20px;
      font-family: monospace;
    }

    /* ── INPUTS ── */
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 520px) {
      .input-grid { grid-template-columns: 1fr; }
      .card { padding: 20px 18px; }
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: #555;
      margin-bottom: 6px;
      font-family: monospace;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: 'Georgia', serif;
      color: #111;
      background: #fafaf8;
      transition: border 0.2s;
      outline: none;
    }

    input:focus { border-color: #111; background: #fff; }

    /* ── BUTTON ── */
    .btn-run {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 0.95rem;
      font-family: 'Georgia', serif;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: background 0.2s;
    }

    .btn-run:hover { background: #333; }
    .btn-run:disabled { background: #999; cursor: not-allowed; }

    /* ── OUTPUT ── */
    #output-card { display: none; }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-pdf {
      padding: 8px 18px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.8rem;
      font-family: monospace;
      cursor: pointer;
      color: #444;
      transition: border 0.2s, color 0.2s;
    }

    .btn-pdf:hover { border-color: #111; color: #111; }

    /* ── REPORT CONTENT ── */
    #report-content {
      font-size: 0.95rem;
      line-height: 1.75;
      color: #222;
    }

    #report-content h2 {
      font-size: 1.15rem;
      font-weight: bold;
      margin: 22px 0 8px;
      color: #111;
      border-bottom: 1px solid #eee;
      padding-bottom: 6px;
    }

    #report-content h3 {
      font-size: 0.95rem;
      font-weight: bold;
      margin: 16px 0 6px;
      color: #333;
    }

    #report-content p { margin-bottom: 10px; }

    #report-content ul {
      padding-left: 20px;
      margin-bottom: 10px;
    }

    #report-content li { margin-bottom: 5px; }

    #report-content strong { color: #111; }

    .metrics-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin: 16px 0;
    }

    .metric-box {
      background: #f5f4f0;
      border-radius: 8px;
      padding: 14px 16px;
      text-align: center;
    }

    .metric-box .val {
      font-size: 1.3rem;
      font-weight: bold;
      color: #111;
    }

    .metric-box .lbl {
      font-size: 0.72rem;
      color: #888;
      font-family: monospace;
      margin-top: 3px;
    }

    /* ── LOADER ── */
    .loader {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #888;
      font-size: 0.88rem;
      font-family: monospace;
      padding: 10px 0;
    }

    .dot-anim span {
      display: inline-block;
      width: 6px; height: 6px;
      background: #aaa;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }

    .dot-anim span:nth-child(2) { animation-delay: 0.2s; }
    .dot-anim span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40% { transform: translateY(-6px); opacity: 1; }
    }


    /* ── PDF styles ── */
    @media print {
      body { background: #fff; padding: 0; }
      .btn-run, .btn-pdf, #input-card { display: none !important; }
    }
  </style>
</head>
<body>

<h1>Find revenue leaks from your website conversion</h1>
<p class="subtitle">AI-powered CRO audits trained on winning conversion patterns, competitor insights, customer reviews, and reddit conversations with actionable fixes you can test immediately.</p>

<div class="wrapper">

  <!-- INPUT CONTAINER -->
  <div class="card" id="input-card">
    <div class="input-grid">
      <div>
        <label>Website URL</label>
        <input type="url" id="url" placeholder="https://yourstore.com" />
      </div>
      <div>
        <label>Monthly Website Visitors</label>
        <input type="number" id="visitors" placeholder="e.g. 50000" min="1" />
      </div>
      <div>
        <label>Current Conversion Rate (%)</label>
        <input type="number" id="cvr" placeholder="e.g. 2.5" step="0.01" min="0" max="100" />
      </div>
      <div>
        <label>Average Order Value — AOV ($)</label>
        <input type="number" id="aov" placeholder="e.g. 85" min="1" />
      </div>
    </div>
    <button class="btn-run" id="run-btn" onclick="generateReport()">Generate Audit →</button>
  </div>

  <!-- OUTPUT CONTAINER -->
  <div class="card" id="output-card">
    <div class="output-header">
      <div class="card-title" style="margin:0">02 — Your CRO Report</div>
      <button class="btn-pdf" onclick="exportPDF()">⬇ Download PDF</button>
    </div>
    <div id="report-content"></div>
  </div>

</div>

<script>
  // ─────────────────────────────────────────────
  // ⚙️  ADD YOUR API KEY HERE
  const ANTHROPIC_API_KEY = "YOUR_API_KEY_HERE";
  // ─────────────────────────────────────────────

  // ─────────────────────────────────────────────
  // ✏️  DEFAULT PROMPT
  //
  //     Placeholders auto-filled at runtime:
  //       {{url}}        → website URL
  //       {{visitors}}   → monthly visitors
  //       {{cvr}}        → conversion rate %
  //       {{aov}}        → average order value
  //       {{monthlyRev}} → estimated monthly revenue
  //       {{orders}}     → estimated monthly orders
  //       {{lift1pct}}   → revenue at CVR +1%
  // ─────────────────────────────────────────────
  const DEFAULT_PROMPT =
`You are a senior DTC Conversion Rate Optimization (CRO) operator specializing in:

- customer psychology & decision friction
- voice-of-customer mining (Reddit, reviews, social platforms)
- trust-building systems in ecommerce
- persuasion-driven copywriting
- funnel and checkout optimization

Your thinking is grounded in:

- LIFT model (clarity, relevance, anxiety, distraction)
- Jobs-to-the-Done theory
- behavioral economics (Kahneman: loss aversion, anchoring)
- objection-based buying psychology
- real-world customer sentiment (Reddit, reviews, YouTube, TikTok, competitor feedback)

You are NOT writing a standard audit.

You are writing a founder-facing conversion diagnosis with embedded, testable CRO experiments and realistic revenue impact estimates.

---

🔥 CORE SCORING SYSTEM (IMPORTANT)

Each CORE CONVERSION DRIVER must include a:

👉 CONVERSION HEALTH SCORE (0–10)

This score represents how healthy that conversion area currently is.

Scoring logic:
- 9–10 = Healthy, strong performing area, minimal friction
- 7–8 = Good, minor optimization opportunities
- 4–6 = Moderate friction, noticeable conversion leakage
- 0–3 = Critical breakdown, major revenue blocker

The score should help founders instantly identify:
- where revenue leakage exists
- what deserves immediate attention
- which friction points are suppressing conversions most

---

INPUTS

- Website URL: {{url}}
- Monthly visitors: {{visitors}}
- Current conversion rate: {{cvr}}%
- Average order value (AOV): ${{aov}}
- Estimated monthly revenue: {{monthlyRev}}
- Estimated monthly orders: {{orders}}
- Revenue if CVR increased by just +1%: {{lift1pct}}

---

CORE TASK

Analyze the website and surrounding category sentiment.

Pull insights from:
- Reddit discussions (category + competitor threads)
- Amazon / Trustpilot / review platforms
- TikTok / YouTube comments
- competitor messaging gaps
- recurring customer objections and frustrations

Focus on:
- why customers hesitate to buy
- what breaks trust
- what creates confusion or decision fatigue
- what competitors communicate better
- what emotional reassurance is missing

Compare:
what the brand is saying
vs
what customers actually care about

Use the provided traffic, conversion rate, and AOV data to estimate:
- realistic conversion uplift potential
- estimated monthly revenue being lost
- realistic revenue upside if key blockers are fixed

Revenue estimates must remain commercially realistic and conservative.
Do NOT fabricate unrealistic growth projections.

---

OUTPUT FORMAT

TITLE (MANDATORY)

“I have observed an estimated X% conversion uplift opportunity representing approximately $Y–$Z/month in recoverable revenue after analyzing ICP discussions, competitor sentiment, and category buying behavior.”

Where:
- X = realistic conversion uplift estimate
- Y–Z = estimated monthly revenue upside range

---

ESTIMATED REVENUE LEAKAGE (MANDATORY)

Briefly estimate:
- current monthly revenue being lost due to conversion friction
- which conversion drivers are responsible for most of the leakage
- where the fastest recoverable upside likely exists

Keep this commercially sharp and easy to understand.

---

COMPETITIVE BENCHMARK SNAPSHOT (MANDATORY)

Brief comparison of:
- what top competitors in this category do better
- what “best-in-class” D2C conversion experience looks like here
- where this brand is clearly underperforming

No tables.
No corporate formatting.
Keep it insight-dense.

---

CORE CONVERSION DRIVERS (ONLY 4)

Each driver must include:

- CONVERSION HEALTH SCORE (0–10)
- customer sentiment insight (Reddit/reviews/competitors)
- psychological explanation
- what is broken on this site
- realistic embedded A/B test ideas

---

1. TRUST & PROOF SYSTEM (≈ 35% weight)

Derived from:
- Rory Sutherland (perception > reality in trust)
- Amazon review heuristics
- social proof psychology

Analyze:
- reviews
- UGC
- guarantees
- authority signals
- credibility cues

Good:
- specific, outcome-driven proof
Bad:
- generic testimonials without believable context

A/B tests may include:
- proof placement near CTA
- testimonial reframing
- UGC integration
- skepticism-reducing copy blocks

---

2. PRODUCT CLARITY & VALUE FRAMING (≈ 25% weight)

Derived from:
- Eugene Schwartz (awareness levels)
- Jobs-to-the-Done (Clayton Christensen)

Analyze:
- instant comprehension
- “why this vs alternatives”
- clarity of transformation/outcome

Good:
- outcome-first messaging
Bad:
- feature dumping without emotional clarity

A/B tests may include:
- hero headline rewrites
- simplifying decision hierarchy
- comparison framing
- restructuring above-the-fold messaging

---

3. OFFER & PRICING PSYCHOLOGY (≈ 20% weight)

Derived from:
- Kahneman (loss aversion)
- anchoring & pricing psychology

Analyze:
- bundles
- discounts
- urgency framing
- value stacking
- pricing justification

Good:
- psychologically reinforced pricing
Bad:
- flat pricing with weak perceived value

A/B tests may include:
- bundle framing
- anchor pricing
- urgency variations
- subscription vs one-time positioning

---

4. UX + DECISION FRICTION (≈ 20% weight)

Derived from:
- Baymard Institute ecommerce research
- cognitive load theory

Analyze:
- mobile UX
- checkout flow
- cognitive overload
- PDP friction points

Good:
- fast, intuitive purchase flow
Bad:
- cluttered pages, hidden information, unnecessary steps

A/B tests may include:
- checkout simplification
- CTA repositioning
- mobile-first restructuring
- reducing PDP cognitive load

---

CONSUMER PSYCHOLOGY INSIGHTS (REDDIT Conversation & Reviews LAYER)

Synthesize:
- what customers fear before purchasing
- what delays purchase decisions
- what builds trust fastest in this category
- what competitors explain better

Focus on:
- recurring objections
- skepticism triggers
- emotional hesitation patterns

Do NOT fabricate quotes.
Only infer realistic behavioral patterns from category sentiment.

---

STYLE RULES (CRITICAL)

Do NOT:
- use filler CRO jargon
- use em-dashes 

Do:
- sound like a sharp ecommerce operator
- be direct, commercially aware, and opinionated
- tie observations to real buyer behavior
- prioritize clarity and actionability
- Keep the tone sharp, data-driven, and consultative. Do not use markdown. Output raw HTML only.`;

  async function generateReport() {
    const url      = document.getElementById('url').value.trim();
    const visitors = document.getElementById('visitors').value.trim();
    const cvr      = document.getElementById('cvr').value.trim();
    const aov      = document.getElementById('aov').value.trim();

    if (!url || !visitors || !cvr || !aov) {
      alert('Please fill in all four fields.');
      return;
    }

    const btn = document.getElementById('run-btn');
    btn.disabled = true;
    btn.textContent = 'Generating…';

    const outputCard    = document.getElementById('output-card');
    const reportContent = document.getElementById('report-content');

    outputCard.style.display = 'block';
    reportContent.innerHTML = `
      <div class="loader">
        Analysing your data
        <div class="dot-anim"><span></span><span></span><span></span></div>
      </div>`;

    // Computed values
    const monthlyRev = ((visitors * cvr / 100) * aov).toLocaleString('en-US', {style:'currency', currency:'USD', maximumFractionDigits:0});
    const orders     = Math.round(visitors * cvr / 100);
    const lift1pct   = (visitors * ((parseFloat(cvr)+1)/100) * aov).toLocaleString('en-US', {style:'currency', currency:'USD', maximumFractionDigits:0});

    // Fill placeholders in the default prompt
    const rawPrompt = DEFAULT_PROMPT;
    const prompt = rawPrompt
      .replace(/{{url}}/g,        url)
      .replace(/{{visitors}}/g,   visitors)
      .replace(/{{cvr}}/g,        cvr)
      .replace(/{{aov}}/g,        aov)
      .replace(/{{monthlyRev}}/g, monthlyRev)
      .replace(/{{orders}}/g,     orders)
      .replace(/{{lift1pct}}/g,   lift1pct);

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": ANTHROPIC_API_KEY,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-calls": "true"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1500,
          messages: [{ role: "user", content: prompt }]
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      const html = data.content.map(b => b.text || '').join('');

      const metricsHTML = `
        <div class="metrics-row">
          <div class="metric-box"><div class="val">${Number(visitors).toLocaleString()}</div><div class="lbl">Monthly Visitors</div></div>
          <div class="metric-box"><div class="val">${cvr}%</div><div class="lbl">Conversion Rate</div></div>
          <div class="metric-box"><div class="val">$${aov}</div><div class="lbl">Avg Order Value</div></div>
          <div class="metric-box"><div class="val">${monthlyRev}</div><div class="lbl">Monthly Revenue</div></div>
        </div>`;

      reportContent.innerHTML = metricsHTML + html;

    } catch (err) {
      reportContent.innerHTML = `<p style="color:red"><strong>Error:</strong> ${err.message}.<br>Check your API key in index.html.</p>`;
    }

    btn.disabled = false;
    btn.textContent = 'Regenerate Audit →';
  }

  function exportPDF() {
    const element = document.getElementById('output-card');
    const opt = {
      margin:      [12, 14, 12, 14],
      filename:    'cro-report.pdf',
      image:       { type: 'jpeg', quality: 0.97 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF:       { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(element).save();
  }
</script>

</body>
</html>
